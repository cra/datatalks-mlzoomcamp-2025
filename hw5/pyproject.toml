[project]
name = "hw5"
version = "0.1.0"
description = "homework 5 for ML Zoomcamp 2025"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.120.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "scikit-learn==1.6.1",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
api_score = "client.score_requests:main"
q4_serve = "server.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server", "src/client"]

[dependency-groups]
dev = [
    "ruff-lsp>=0.0.62",
]
